name: najem_app
description: "Najem Starcall Official Mobile App"
publish_to: 'none'

# Incremented build version (+3) to satisfy App Store Connect / TestFlight & Google Play upload rules
version: 2.1.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0  
  flutter_inappwebview: ^6.0.0
  connectivity_plus: ^6.0.0
  onesignal_flutter: ^5.7.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

# Configure the app launcher icon generator settings
flutter_launcher_icons:
  android: true           # Overwrites @mipmap/ic_launcher directly
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true